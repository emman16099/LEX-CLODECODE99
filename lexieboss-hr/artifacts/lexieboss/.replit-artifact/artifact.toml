kind = "web"
previewPath = "/"
title = "LEXIEBOSS"
version = "1.0.0"
id = "artifacts/lexieboss"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19184

[services.development]
run = "pnpm --filter @workspace/lexieboss run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/lexieboss", "run", "build" ]
publicDir = "artifacts/lexieboss/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19184"
BASE_PATH = "/"
